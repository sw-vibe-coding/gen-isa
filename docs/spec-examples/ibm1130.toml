# IBM 1130 ISA spec
#
# Opcode values are 5-bit (top 5 bits of the first instruction word).
# Cross-checked against IBM 1130 Functional Characteristics (GA26-5881)
# via the S1130 emulator's transcribed table; values themselves are
# factual content from the manual, not code.
#
# Encoding style is "bit_fields": the generator emits encode.rs / decode.rs
# from the [[format.field]] declarations. F-bit format dispatch is via
# first_word_bits; bit 5 of the first 16-bit word selects short (F=0) or
# long (F=1) form.
#
# Coverage: 24 standard opcodes. Sub-op selection inside SLA/SRA (single
# vs double, left-or-rotate) is left to the codegen / emulator; the spec
# captures the top-5-bit opcode only, with the count or sub-op field
# encoded into the displacement bits per the manual.

[arch]
display_name = "IBM 1130"
type_name = "Ibm1130"
crate_slug = "ibm1130"

[memory]
address_unit = "Word16"
endian = "Big"
word_bits = 16
min_instr_bytes = 2
max_instr_bytes = 4

[branch]
# Short-form displacement is signed 8-bit; offsets are in address units
# (i.e. 16-bit words). 1130 PC points at the next instruction at branch
# resolve time, so pipeline_delay_bytes = 0.
short_offset_min = -128
short_offset_max = 127
max_short_branch_instructions = 64
pipeline_delay_bytes = 0

[encoding]
style = "bit_fields"
length_dispatch = "first_word_bits"

# ----- Registers -----
# ACC + EXT are the accumulator and extension; XR1-3 are index registers
# (memory-mapped at addresses 1..3 in the real machine, but logically
# addressable as registers via the 2-bit tag field). XR3 is reserved by
# convention as the future frame pointer (decisions.md Sec 1).
# IAR is the instruction address register (PC).

[[register]]
name = "acc"
class = "acc"
index = 0

[[register]]
name = "ext"
class = "ext"
index = 1

[[register]]
name = "xr1"
class = "xr"
index = 2

[[register]]
name = "xr2"
class = "xr"
index = 3

[[register]]
name = "xr3"
class = "fp"
index = 4

[[register]]
name = "iar"
class = "pc"
index = 5

# ACC + EXT pair: required together for double-precision arithmetic
# (M multiply, D divide, LDD load-double, STD store-double).
[[fixed_pair]]
hi = "acc"
lo = "ext"
purpose = "double-precision arithmetic (M, D, LDD, STD, AD, SD)"

# ----- Formats -----
# Short form: 16 bits total
#   bits  0..4  (5): opcode
#   bit       5 (1): F = 0 (discriminator)
#   bits  6..7  (2): tag (XR selector, 0=no XR, 1=XR1, 2=XR2, 3=XR3)
#   bits 8..15  (8): displacement (signed)
#
# Long form: 32 bits total (two big-endian words)
#   bits  0..4  (5): opcode
#   bit       5 (1): F = 1 (discriminator)
#   bits  6..7  (2): tag
#   bit       8 (1): indirect
#   bits  9..15 (7): mask -- BSC/BSI condition mask byte. Per Moore's
#                    1968 FORTH listing's :POSITIVE/:NEGATIVE/:EQUAL/
#                    :EVEN constants, the bit assignments are:
#                      0x04 = Even (E)
#                      0x08 = Positive (+)
#                      0x10 = Negative (-)
#                      0x20 = Zero (Z)
#                      0x40 = Carry (C)
#                      (bit 0x01, 0x02 unused; 0x80 reserved)
#                    For non-BSC/BSI long-form ops the asm/codegen
#                    enforce mask = 0 (the historical "must be zero"
#                    constraint becomes a per-mnemonic policy).
#   bits 16..31 (16): address

[[format]]
name = "short"
size_bytes = 2

[format.discriminator]
offset = 5
width = 1
value = 0

[[format.field]]
name = "op"
kind = "opcode"
offset = 0
width = 5

[[format.field]]
name = "f"
kind = "reserved"
offset = 5
width = 1
value = 0

[[format.field]]
name = "tag"
kind = "tag"
offset = 6
width = 2

[[format.field]]
name = "disp"
kind = "disp"
offset = 8
width = 8
signed = true

[[format]]
name = "long"
size_bytes = 4

[format.discriminator]
offset = 5
width = 1
value = 1

[[format.field]]
name = "op"
kind = "opcode"
offset = 0
width = 5

[[format.field]]
name = "f"
kind = "reserved"
offset = 5
width = 1
value = 1

[[format.field]]
name = "tag"
kind = "tag"
offset = 6
width = 2

[[format.field]]
name = "indirect"
kind = "indirect"
offset = 8
width = 1

[[format.field]]
name = "mask"
kind = "imm"
offset = 9
width = 7

[[format.field]]
name = "address"
kind = "imm"
offset = 16
width = 16

# ----- Opcodes (24 standard ops; cross-checked against FC manual via S1130) -----

# Memory reference (most have both short and long forms)
[[opcode]]
name = "Load"
mnemonic = "ld"
value = 0x18
formats = ["short", "long"]
role = "mem.load"

[[opcode]]
name = "LoadDouble"
mnemonic = "ldd"
value = 0x19
formats = ["short", "long"]
role = "mem.load_double"

[[opcode]]
name = "Store"
mnemonic = "sto"
value = 0x1A
formats = ["short", "long"]
role = "mem.store"

[[opcode]]
name = "StoreDouble"
mnemonic = "std"
value = 0x1B
formats = ["short", "long"]
role = "mem.store_double"

[[opcode]]
name = "LoadIndex"
mnemonic = "ldx"
value = 0x0C
formats = ["short", "long"]
role = "mem.load_index"

[[opcode]]
name = "StoreIndex"
mnemonic = "stx"
value = 0x0D
formats = ["short", "long"]
role = "mem.store_index"

[[opcode]]
name = "LoadStatus"
mnemonic = "lds"
value = 0x04
formats = ["short", "long"]
role = "mem.load_status"

[[opcode]]
name = "StoreStatus"
mnemonic = "sts"
value = 0x05
formats = ["short", "long"]
role = "mem.store_status"

# Arithmetic
[[opcode]]
name = "Add"
mnemonic = "a"
value = 0x10
formats = ["short", "long"]
role = "arith.add"

[[opcode]]
name = "AddDouble"
mnemonic = "ad"
value = 0x11
formats = ["short", "long"]
role = "arith.add_double"

[[opcode]]
name = "Subtract"
mnemonic = "s"
value = 0x12
formats = ["short", "long"]
role = "arith.sub"

[[opcode]]
name = "SubtractDouble"
mnemonic = "sd"
value = 0x13
formats = ["short", "long"]
role = "arith.sub_double"

[[opcode]]
name = "Multiply"
mnemonic = "m"
value = 0x14
formats = ["short", "long"]
role = "arith.mul.pair"          # ACC * M -> ACC,EXT

[[opcode]]
name = "Divide"
mnemonic = "d"
value = 0x15
formats = ["short", "long"]
role = "arith.div.pair"          # ACC,EXT / M -> ACC; remainder in EXT

# Logical
[[opcode]]
name = "And"
mnemonic = "and"
value = 0x1C
formats = ["short", "long"]
role = "bitwise.and"

[[opcode]]
name = "Or"
mnemonic = "or"
value = 0x1D
formats = ["short", "long"]
role = "bitwise.or"

[[opcode]]
name = "ExclusiveOr"
mnemonic = "eor"
value = 0x1E
formats = ["short", "long"]
role = "bitwise.xor"

# Shift (special: count and sub-op are encoded in the low bits per FC manual;
# the spec captures the top-5 opcode only; codegen / asm / emulator decode the
# count and sub-op (SLA/SLT/SLCA/SLC) from the displacement field).
[[opcode]]
name = "ShiftLeft"
mnemonic = "sla"
value = 0x02
formats = ["short"]
role = "bitwise.shift_left"

[[opcode]]
name = "ShiftRight"
mnemonic = "sra"
value = 0x03
formats = ["short"]
role = "bitwise.shift_right"

# Branch / control
[[opcode]]
name = "BranchSkipCondition"
mnemonic = "bsc"
value = 0x09
formats = ["short", "long"]
role = "branch.cond"

[[opcode]]
name = "BranchStore"
mnemonic = "bsi"
value = 0x08
formats = ["short", "long"]
role = "branch.call"             # Branch and Store IAR (subroutine call)

[[opcode]]
name = "ModifyIndex"
mnemonic = "mdx"
value = 0x0E
formats = ["short", "long"]
role = "branch.modify_index"

[[opcode]]
name = "Wait"
mnemonic = "wait"
value = 0x06
formats = ["short"]
role = "control.wait"

[[opcode]]
name = "ExecuteInputOutput"
mnemonic = "xio"
value = 0x01
formats = ["long"]               # XIO requires the address operand
role = "control.io"
